[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "food-deal-watch"
version = "0.1.0"
description = "Public-promo food delivery estimates for Toronto"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
dealwatch = "dealwatch.cli:main"

[tool.setuptools.package-data]
dealwatch = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
